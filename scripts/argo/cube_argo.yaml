# biodiv-cube -- build the materialised kNDVI cube, then infer from it.
#
#   argo submit -n easi-workflows-argo scripts/argo/cube_argo.yaml \
#     -p limit-tiles=90 -p num-chunks=5
#
# This is `docs/24` Option A: one construction pass on cheap CPU, then all inference against
# the cube on a small GPU node. It is SEPARATE from process_argo.yaml, which stays as the
# working path that reads COGs directly -- nothing here modifies it, and either can be run.
#
# ---------------------------------------------------------------------
# Three entrypoints, because the two stages are worth running apart
# ---------------------------------------------------------------------
#   main         build everything, then infer. The default, and biphasic: infer-chunk depends
#                on build-chunk, so NO tile is inferred until EVERY tile is built.
#   build-only   the construction pass alone (`argo submit --entrypoint build-only`)
#   infer-only   inference alone, against whatever the cube already holds
#   gpu-check    one pod on one GPU node and nothing else -- the smoke test to run FIRST
#
# NOTE ON limit-tiles: 0 means NO CAP, i.e. every missing tile, not "none". To try a small run
# set it to a small number (e.g. 6), never to 0.
#
# **On overlapping the two.** The stages are 1-to-1 per tile, so waiting for the whole build is
# not technically necessary, and the wall-time case for overlapping is real: total goes from
# build+infer to max(build, infer). The ratio is what decides it. A build pod produces a tile
# every ~360 s (27 years, --workers 7, extrapolated from the 292,2 s measured at 22 years in
# `docs/21` 8.17); a GPU node at --jobs 4 retires one every ~17,5 s. So ONE GPU NODE NEEDS
# ~20 BUILD PODS to stay fed. Below that ratio the GPU idles at GPU prices, which is the same
# error `docs/24` 3 rejected when it killed the bundled --write-cube plan.
#
# It is deliberately not the default for the first run, and `docs/24` 5 says why: resist
# pipelining until A has run once. Overlapping loses nothing durable -- the stores land in S3
# either way, so re-runs stay cheap -- but it does mean a bad cube is consumed before anyone
# can look at it, and the build pass has never run at scale. Once it has, overlapping is
# `argo submit --entrypoint infer-only` alongside a running build, with no edit to this file:
# cube_progress.py and tile_progress.py both answer "what is ready" by listing S3, so a polling
# pipeline falls out of the tooling that already exists.
#
# ---------------------------------------------------------------------
# What each stage costs, measured
# ---------------------------------------------------------------------
# build-chunk  ~360 s/tile (27 years). The scheduler is `--workers 7`, NOT the `--load-threads`
#              that process_argo.yaml uses: that setting is tuned around the CNN competing with
#              the cluster's workers, and this pass has no CNN. Measured 688,8 s -> 292,2 s,
#              2,36x, rasters bit-identical between the two (`docs/21` 8.17).
# infer-chunk  ~70 s/tile at --jobs 4 on one T4, from the cube (`docs/21` 8.15). The stores are
#              pulled to node-local disk first by stage_cube.py: reading them there is 0,49 s a
#              tile against 3,1 s direct from S3 (`docs/21` 8.16), which turns a ~13 % read tax
#              into ~4 %. Staging measured 115 MB/s, ~2,7 s a tile.
#
# Dedup, both stages, same principle as process_argo.yaml: no separate progress tracker, S3 is
# the source of truth. cube_progress.py treats a tile as built only when its store carries the
# completion marker -- zarr_write writes the group attributes last, so a build killed mid-write
# reads as absent rather than as a short tile, and gets rebuilt.
#
# Sizing: build-deadline-seconds must cover (tiles per pod) x ~360 s, and
# infer-deadline-seconds (tiles per pod) x ~70 s plus the one-off staging.
#
# ---------------------------------------------------------------------
# UNVERIFIED FROM OUTSIDE THE CLUSTER -- check these two before the first submit
# ---------------------------------------------------------------------
#  1. GPU scheduling. Now written against the real pool -- dask-gpu-worker-node-pool -- so
#     both its taints are tolerated, its node-purpose label is selected, V100 is excluded
#     (Volta/sm_70, dropped by CUDA 13) and single-GPU instances are required. What remains
#     unverified is only whether that pool actually admits a non-dask pod in practice, which
#     gpu-preflight settles in one pod and one minute. NOTE it is a BORROWED pool: it is
#     described as dedicated to dask workers, and this workflow is not one.
#  2. cuda-tag is set to 13-2-1 and gpu-image-tag to develop.latest; both were confirmed to
#     exist on 2026-09-11. Neither is something this file can re-check for itself, and
#     develop.latest moves, so if GPU pods fail to pull that is the first thing to look at --
#     and note the CUDA version is hyphenated, since it is part of the repository name.
#  (S3 is NOT a question: the easi-workflows-team service account carries access to every
#   prefix below easi-workflows-team/, so the new cube/ prefix is covered like the rest.
#   check-access still writes a preflight object to it, which costs nothing and localises a
#   credential problem to the first second of the run.)
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: biodiv-cube-
  namespace: easi-workflows-argo
  labels:
    name: biodiv-cube
    owner: jlopatin
    team: easi-workflows-team
spec:
  arguments:
    parameters:
    # Only build-chunk needs this one. `import biodiv.maptask` pulls torch in through
    # mapinfer -- verified, not assumed -- so the build pod cannot use the light image even
    # though the build itself never runs a model. Making mapinfer's torch import lazy would
    # free it, which is worth considering if spot churn makes pod startup matter: the build
    # pass is meant for the cheapest capacity going, and that is the capacity that restarts.
    - name: base-image
      value: 444488357543.dkr.ecr.us-west-2.amazonaws.com/easi-workflows-base-torch-cpu:develop.latest
    # The list and split steps need boto3 and the standard library, nothing else: they read
    # and write CSVs and call S3. cube_progress.py deliberately does not import `biodiv` at
    # all (it repeats the store-name convention instead), which is what lets them run here.
    # UNVERIFIED name, but cheap to get wrong -- these steps fail within seconds of the
    # submit, unlike the GPU image, which is why that one gets a preflight and this does not.
    - name: light-image
      value: 444488357543.dkr.ecr.us-west-2.amazonaws.com/easi-workflows-base:develop.latest
    # The GPU image is composed from cuda-tag rather than written out, because the CUDA
    # version is the only part anyone needs to change and it is the part nobody can guess.
    # The repository is easi-workflows-base-nvidia-<CUDA_TAG>-torch-cudnn-runtime.
    - name: gpu-registry
      value: 444488357543.dkr.ecr.us-west-2.amazonaws.com
    # NOTE THE HYPHENS: the CUDA version appears as 13-2-1, not 13.2.1, because it is part of
    # a repository name. On 2026-09-11 it was confirmed to be the ONLY CUDA version built in
    # this registry, and to be in regular use by the team -- so it is the right default and
    # there is nothing to fall back TO. If gpu-preflight ever rejects it, the remedy is a
    # different small GPU node rather than a different image; see the note there. It is not discoverable from a Jupyter pod -- the registry is in account
    # 444488357543 while the notebook role lives in 262301216538, so ecr:DescribeRepositories
    # is denied cross-account. To re-check, with credentials for the workflows account:
    #
    #   # which CUDA versions exist -- each is its OWN repository, the version is in the name
    #   aws ecr describe-repositories --registry-id 444488357543 --region us-west-2 \
    #     --query 'repositories[?contains(repositoryName, `nvidia`)].repositoryName' --output table
    #
    #   # which tags exist inside one, newest last
    #   aws ecr describe-images --registry-id 444488357543 --region us-west-2 \
    #     --repository-name easi-workflows-base-nvidia-13-2-1-torch-cudnn-runtime \
    #     --query 'sort_by(imageDetails,&imagePushedAt)[].[imagePushedAt,imageTags[0]]' --output table
    #
    # Or, if ECR is denied but the cluster is reachable, ask a running pod what it uses:
    #   kubectl -n easi-workflows-argo get pods \
    #     -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' | sort -u | grep -i nvidia
    #
    # gpu-preflight below is what actually settles it: it pulls this exact image and fails in
    # a minute if the tag is wrong, rather than at the end of a `main` run.
    - name: cuda-tag
      value: 13-2-1
    # Confirmed to exist in the 13-2-1 repository on 2026-09-11 (pushed 2026-09-06). The other
    # tags are PR builds (PR35, PR38, PR39), which are branch images rather than release ones,
    # so develop.latest is right even though some PR tags are newer. It is a moving tag: it
    # will point at something else after the next merge, which is what gpu-preflight is for.
    #
    # Verified with `skopeo inspect --raw` on 2026-09-11, not inferred: the bare tag is an OCI
    # index (application/vnd.oci.image.index.v1+json) holding exactly ONE real platform,
    # linux/amd64, plus an attestation manifest (architecture "unknown" -- that is the third,
    # untagged entry per push that a describe-images listing shows). So the bare tag is the
    # right one to use, and there being no arm64 image is exactly why the GPU templates pin
    # kubernetes.io/arch: amd64 -- an arm64 node would fail the pull, not the CUDA call.
    - name: gpu-image-tag
      value: develop.latest
    - name: aws-image
      value: amazon/aws-cli:2.17.62
    - name: repo-url
      value: https://github.com/JavierLopatin/Biodiversity_Chile.git
    - name: repo-branch
      value: main
    - name: git-image
      value: registry.k8s.io/git-sync/git-sync:v4.5.0
    - name: db-config-secret
      value: easi-odc-v2-user-db
    - name: s3-cube
      value: s3://easido-prod-dc-data-projects/easi-workflows-team/biodiv/cube/chile_30m
    - name: s3-dest
      value: s3://easido-prod-dc-data-projects/easi-workflows-team/biodiv/maps/chile_30m_2000_2026
    - name: s3-assets
      value: s3://easido-prod-dc-data-projects/easi-workflows-team/biodiv/assets
    - name: s3-mapbiomas
      value: s3://easido-prod-dc-data-projects/easi-workflows-team/biodiv/MapBiomas
    - name: tiles-csv-name
      value: tiles_native_10km.csv
    - name: years
      value: 2000-2026
    - name: area-m2
      value: '900'
    - name: tag
      value: cube-run1
    - name: limit-tiles
      value: '90'
    - name: num-chunks
      value: '5'
    - name: build-workers
      value: '7'
    - name: infer-jobs
      value: '4'
    - name: build-deadline-seconds
      value: '10800'
    - name: infer-deadline-seconds
      value: '7200'
    # NOTE ON SPOT. dask-gpu-worker-node-pool is spot-only, with expireAfter 12h and a 10m
    # termination grace period, so an inference pod can lose its node mid-chunk. Three things
    # already absorb that, which is why it is acceptable rather than merely tolerated:
    #   - scripts/73 --resume treats a tile-year as done once its GeoTIFF is in S3, so a
    #     reclaimed pod loses at most the tile in flight, not the chunk;
    #   - retryStrategy limit 2 on infer-chunk reschedules it;
    #   - stage_cube.py skips stores already present, though a retry landing on a NEW node
    #     re-stages from S3 (~49 s for 18 tiles), since the scratch emptyDir dies with the node.
    # The 2h deadline sits inside the 12h node expiry, so expiry should never cut a chunk.
    # karpenter.sh/do-not-disrupt on the pod blocks Karpenter's VOLUNTARY disruption
    # (consolidation, drift, expiry); it cannot block a spot reclaim, which is involuntary.
  artifactGC:
    serviceAccountName: easi-workflows-team-sa-argo
    strategy: OnWorkflowDeletion
  entrypoint: main
  parallelism: 5
  podGC:
    strategy: OnWorkflowSuccess
  serviceAccountName: easi-workflows-team-sa-argo
  templates:

  # ---------------- DAGs ----------------
  - name: main
    dag:
      # If gpu-preflight fails, let the build stage run to completion anyway. The build is the
      # expensive half (~360 s a tile) and it is fully resumable, so throwing away partly-built
      # capacity to report a GPU problem sooner would be a poor trade -- the report is already
      # immediate, since the preflight runs alongside the build rather than after it. Fix the
      # image and submit --entrypoint infer-only against the cube that got built.
      # It also means one bad build chunk does not cancel the other four, which are independent.
      failFast: false
      tasks:
      - name: check-access
        template: check-access
        arguments:
          parameters:
          - name: require-gpu
            value: 'true'
      - name: gpu-preflight
        template: gpu-preflight
        depends: check-access
      - name: list-to-build
        template: list-to-build
        depends: check-access
      - name: split-build
        template: split-tiles
        depends: list-to-build
        arguments:
          artifacts:
          - name: missing-csv
            from: '{{tasks.list-to-build.outputs.artifacts.missing-csv}}'
      - name: build-chunk
        template: build-chunk
        depends: split-build
        withParam: '{{tasks.split-build.outputs.parameters.chunk-ids}}'
        arguments:
          artifacts:
          - name: chunks
            from: '{{tasks.split-build.outputs.artifacts.chunks}}'
          parameters:
          - name: chunk-id
            value: '{{item}}'
      # THE BARRIER. This one `depends` is what makes the run biphasic; every build-chunk pod
      # must finish before any inference starts. Removing it is not the way to overlap -- use
      # --entrypoint infer-only in a second submission instead, so the two stages keep their
      # own deadlines, parallelism and retries.
      - name: list-missing-maps
        template: list-missing-maps
        depends: build-chunk && gpu-preflight
      - name: split-infer
        template: split-tiles
        depends: list-missing-maps
        arguments:
          artifacts:
          - name: missing-csv
            from: '{{tasks.list-missing-maps.outputs.artifacts.missing-csv}}'
      - name: infer-chunk
        template: infer-chunk
        depends: split-infer
        withParam: '{{tasks.split-infer.outputs.parameters.chunk-ids}}'
        arguments:
          artifacts:
          - name: chunks
            from: '{{tasks.split-infer.outputs.artifacts.chunks}}'
          parameters:
          - name: chunk-id
            value: '{{item}}'

  # The cheapest possible test of the GPU half: ONE pod on ONE GPU node, nothing else.
  #
  #   argo submit -n easi-workflows-argo scripts/argo/cube_argo.yaml --entrypoint gpu-check
  #
  # Deliberately has no other tasks -- no check-access, no tile list, no S3 assets, no git-sync
  # -- so it needs nothing staged and cannot fail for a reason unrelated to the GPU. What it
  # proves, all of which is otherwise only discovered at the END of a `main` run:
  #   - dask-gpu-worker-node-pool admits a non-dask pod (both taints tolerated, label matched)
  #   - the nodeAffinity resolves to a real instance (no v100, single GPU, local NVMe)
  #   - the image name built from cuda-tag exists and pulls
  #   - torch sees the card AND has kernels for its compute capability, with a real matmul
  #   - how fast /scratch actually is, which decides whether staging the cube is worth 4,3 %
  #     of a tile or 6,9 % (docs/21 8.16)
  # Run this BEFORE the build smoke test: it is faster, cheaper, and answers the only things
  # about this workflow that were never verifiable from a CPU pod.
  - name: gpu-check
    dag:
      tasks:
      - name: gpu-preflight
        template: gpu-preflight

  - name: build-only
    dag:
      tasks:
      - name: check-access
        template: check-access
        arguments:
          parameters:
          - name: require-gpu
            value: 'false'
      - name: list-to-build
        template: list-to-build
        depends: check-access
      - name: split-build
        template: split-tiles
        depends: list-to-build
        arguments:
          artifacts:
          - name: missing-csv
            from: '{{tasks.list-to-build.outputs.artifacts.missing-csv}}'
      - name: build-chunk
        template: build-chunk
        depends: split-build
        withParam: '{{tasks.split-build.outputs.parameters.chunk-ids}}'
        arguments:
          artifacts:
          - name: chunks
            from: '{{tasks.split-build.outputs.artifacts.chunks}}'
          parameters:
          - name: chunk-id
            value: '{{item}}'

  - name: infer-only
    dag:
      tasks:
      - name: check-access
        template: check-access
        arguments:
          parameters:
          - name: require-gpu
            value: 'true'
      - name: gpu-preflight
        template: gpu-preflight
        depends: check-access
      - name: list-missing-maps
        template: list-missing-maps
        depends: gpu-preflight
      - name: split-infer
        template: split-tiles
        depends: list-missing-maps
        arguments:
          artifacts:
          - name: missing-csv
            from: '{{tasks.list-missing-maps.outputs.artifacts.missing-csv}}'
      - name: infer-chunk
        template: infer-chunk
        depends: split-infer
        withParam: '{{tasks.split-infer.outputs.parameters.chunk-ids}}'
        arguments:
          artifacts:
          - name: chunks
            from: '{{tasks.split-infer.outputs.artifacts.chunks}}'
          parameters:
          - name: chunk-id
            value: '{{item}}'

  # ---------------- steps ----------------
  # Proves, in about a minute and on one short-lived pod, the three things about the GPU side
  # that nothing else here can check: that the image name resolves and pulls, that the
  # scheduling hints actually get this workflow a GPU, and that the torch in that image can
  # run on the card it lands on. Under `main` the GPU pods are otherwise the LAST thing to
  # run, so without this any of the three would surface with the whole cube already built.
  #
  # The arch check is the non-obvious one, and it is cheap insurance rather than an expected
  # problem: the team uses this image regularly, so it is already known to work on the GPUs
  # they run. It stays because the failure mode is nasty and the test is a minute -- newer CUDA
  # releases drop older GPU architectures, so an image can pull cleanly, see the card, and
  # still have no kernels for it, and torch then fails at the FIRST FORWARD with "no kernel
  # image is available for execution on the device". At hour six of a run that error does not
  # look like an image problem. A T4 is compute capability 7.5; get_arch_list() settles it in
  # advance. If it ever does fail, the fix is a different small GPU node (an A10G on g5 is
  # sm_86), since 13-2-1 was the only CUDA version in this registry on 2026-09-11.
  - name: gpu-preflight
    activeDeadlineSeconds: '900'
    container:
      image: '{{workflow.parameters.gpu-registry}}/easi-workflows-base-nvidia-{{workflow.parameters.cuda-tag}}-torch-cudnn-runtime:{{workflow.parameters.gpu-image-tag}}'
      command: [python, -c]
      args:
      - |
        import sys, torch
        print("torch", torch.__version__, "built for CUDA", torch.version.cuda, flush=True)
        if not torch.cuda.is_available():
            sys.exit("no CUDA device visible: the pod did not get a GPU, or the image "
                     "cannot see it. Check the toleration/nodeSelector on infer-chunk.")
        name = torch.cuda.get_device_name(0)
        cap = torch.cuda.get_device_capability(0)
        archs = torch.cuda.get_arch_list()
        print(f"device: {name}  capability sm_{cap[0]}{cap[1]}", flush=True)
        print(f"kernels built for: {archs}", flush=True)
        if f"sm_{cap[0]}{cap[1]}" not in archs:
            # Unlikely -- this image is in regular use by the team -- but if it happens
            # there is no older cuda-tag to drop back to, since 13-2-1 was the only CUDA
            # version in this registry on 2026-09-11. The remedy is a different small GPU
            # node: a T4 is sm_75 (g4dn), an A10G is sm_86 (g5), and both come in an 8-vCPU
            # size that fits the 7 cores this workflow asks for. docs/21 8.15 found a bigger
            # card buys nothing, so that would be a compatibility choice rather than a
            # performance one -- and it moves the cost arithmetic in that section.
            sys.exit(f"this torch has no kernels for sm_{cap[0]}{cap[1]} ({name}), and no "
                     f"older CUDA image exists to fall back to. Needs a GPU family in "
                     f"{archs} -- or a new image built for sm_{cap[0]}{cap[1]}.")
        # Actually run something, because is_available() alone has never proven a kernel runs.
        a = torch.randn(256, 256, device="cuda")
        print("matmul ok:", float((a @ a).sum()) == float((a @ a).sum()), flush=True)

        # Is /scratch actually on the NVMe? The nodeAffinity guarantees the INSTANCE has local
        # NVMe, but whether an emptyDir lands on it depends on the NodeClass wiring the instance
        # store into the kubelet dataroot -- which this workflow cannot see. So measure it.
        # docs/21 8.16: reading a staged store is decompression-bound at ~0,48 s and needs
        # ~700 MB/s from disk to stay that way; gp3 at 125 MB/s would make it ~2,7 s.
        # This REPORTS and does not fail: ~2,7 s is still no worse than the 3,1 s of reading
        # straight from S3, so a slow scratch means staging stops winning, not that the run
        # breaks. Failing here would block a perfectly good inference pass.
        import os, time
        probe, n = "/scratch/probe.bin", 1_500_000_000
        try:
            buf = b"\0" * (1 << 20)
            t = time.perf_counter()
            with open(probe, "wb") as f:
                for _ in range(n >> 20):
                    f.write(buf)
                f.flush(); os.fsync(f.fileno())
            wrote = time.perf_counter() - t
            fd = os.open(probe, os.O_RDONLY)                 # drop it from page cache first,
            os.posix_fadvise(fd, 0, 0, os.POSIX_FADV_DONTNEED)   # or this measures RAM
            os.close(fd)
            t = time.perf_counter()
            with open(probe, "rb") as f:
                while f.read(1 << 20):
                    pass
            read = time.perf_counter() - t
            mb = n / 1e6
            print(f"/scratch write {mb / wrote:.0f} MB/s, cold read {mb / read:.0f} MB/s",
                  flush=True)
            # Three bands, because a single cutoff was misleading: the first version said
            # "staging wins" at >500 MB/s while the analysis in docs/21 8.16 uses ~700 MB/s as
            # the point where the read stops being I/O-bound. Both were defensible and they
            # disagreed, which is worse than either. Measured single-stream, and note that
            # --jobs 4 will have four readers sharing whatever the device gives.
            r = mb / read
            print("/scratch verdict:",
                  "NVMe-class; the read is decompression-bound, staging is at its best" if r > 700
                  else "usable NVMe; the read is partly I/O-bound but staging still beats "
                       "reading from S3 by ~2x" if r > 200
                  else "SLOW -- staging only ties reading from S3. Check whether the NodeClass "
                       "puts the instance store on the kubelet dataroot",
                  flush=True)
        except Exception as e:
            print(f"/scratch probe skipped: {type(e).__name__}: {e}", flush=True)
        finally:
            try: os.unlink(probe)
            except OSError: pass
        print("GPU PREFLIGHT OK", flush=True)
      resources:
        # Deliberately the SAME request as infer-chunk, so the preflight provisions the shape
        # inference will actually get rather than a different one. Karpenter brings up a whole
        # node either way, so asking for this costs nothing and the pod lives about a minute.
        limits: {cpu: '6', memory: 20Gi, nvidia.com/gpu: 1}
        requests: {cpu: '6', memory: 20Gi, nvidia.com/gpu: 1}
      volumeMounts:
      - {mountPath: /scratch, name: scratch}
    # ---- scheduling onto dask-gpu-worker-node-pool -------------------------------------
    # Reuses the existing Karpenter pool "dask-gpu-worker-node-pool" (spot, instance-category
    # p/g, amd64). There is no dedicated pool for this job and that pool has ample limits
    # (480 CPU / 60 GPU) and sits at 0 nodes, so it scales from zero on demand.
    #
    # The pool carries TWO taints and BOTH must be tolerated or nothing schedules at all:
    #   nvidia.com/gpu=true:NoSchedule
    #   k8s.dask.org/dedicated=worker:NoSchedule   <- easy to miss; it is the dask-only gate
    # Tolerating the second means borrowing a pool described as "dedicated ... for dask worker
    # Pods". That is fine mechanically -- a taint is only a gate -- but it is a borrowed pool,
    # so if the team ever needs it to be genuinely dask-only, this is the workflow to move.
    nodeSelector:
      # Targets that pool specifically rather than any GPU node that happens to exist.
      k8s.dask.org/node-purpose: worker
      # amd64 because the image index holds only linux/amd64 (see gpu-image-tag). The pool
      # already requires amd64, so this is agreement rather than a new constraint.
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            # THE IMPORTANT ONE. The pool allows l40s, l4, a10g, t4 AND v100. A V100 is Volta,
            # compute capability sm_70, which CUDA 13 dropped -- so a cheap spot V100 would
            # pull the image fine, see the GPU fine, and then die at the first forward with
            # "no kernel image is available for execution on the device". The other four are
            # sm_75 (t4), sm_86 (a10g) and sm_89 (l4, l40s), all of which CUDA 13 keeps.
            # This is what turns that failure from likely-on-spot into impossible.
            - key: eks.amazonaws.com/instance-gpu-name
              operator: NotIn
              values: [v100]
            # One GPU per node. The pool permits up to 4, and docs/21 8.15 measured the knee at
            # 4-6 processes on a SINGLE card with ~1 vCPU each -- so a 4-GPU node would be
            # about 4x over-provisioned and three cards would sit idle. Plenty of single-GPU
            # shapes exist (g4dn, g5, g6), so this does not meaningfully narrow spot choice.
            - key: eks.amazonaws.com/instance-gpu-count
              operator: In
              values: ['1']
            # Local NVMe: a cheap improvement, not a prerequisite. Measured (docs/21 8.16),
            # per tile at --jobs 4: reading straight from S3 costs 8,3 s (four readers contend;
            # 3,1 s solo), staging costs 2,7 s of transfer plus 0,47 s to read back warm or
            # 2,50 s genuinely cold on a ~134 MB/s disk. So staging wins either way -- 2,6x warm,
            # 1,6x cold -- and NVMe buys the difference between those two. It also covers the
            # case where a chunk outgrows the page cache, which at the default 18 tiles it does
            # not: ~6 GB staged against a 24Gi limit with ~8 GB of work. Every shape that
            # survives the two filters above
            # (g4dn, g5, g6, g6e) carries >=125 GB of it, so this narrows nothing in practice;
            # it excludes p3, which is EBS-only, and which the v100 filter already excluded.
            # 100 GB leaves room for a CUDA image plus the staged chunk several times over.
            #
            # CAVEAT: this guarantees the INSTANCE has NVMe, not that the emptyDir lands on it
            # -- that depends on the NodeClass wiring the instance store into the kubelet's
            # dataroot. EKS Auto Mode NodeClasses generally do this automatically, but this pool
            # uses a shared one and it is not verifiable from here, so gpu-preflight measures
            # the scratch volume directly rather than assuming.
            - key: eks.amazonaws.com/instance-local-nvme
              operator: Gt
              values: ['100']
        # Node SIZE is a PREFERENCE, not a requirement, and the split above/below is the whole
        # lesson from two failed attempts at this.
        #
        # The first gpu-check landed on a g4dn.8xlarge: 32 vCPU around a SINGLE T4, ~3x the
        # price of a 2xlarge for the same one card. Making <=16 vCPU a hard requirement then
        # made the pod UNSCHEDULABLE -- "no instance type which had enough resources and the
        # required offering met the scheduling requirements" -- even though six single-GPU
        # shapes satisfy it on paper (g4dn/g5/g6 2xlarge and 4xlarge). The operative word is
        # OFFERING: instance type x zone x spot. The small single-GPU shapes simply had no spot
        # capacity in these zones, while the 32-vCPU one did. That is market weather, and
        # encoding it as a hard constraint means the run stops whenever the weather changes.
        #
        # So: the things above are CORRECTNESS and stay hard -- a v100 would fail at the first
        # forward (no sm_70 kernels, confirmed in logs/bench_gpu_preflight.log), a multi-GPU
        # node wastes cards, and without local NVMe staging the cube stops paying. Size is only
        # COST. Preferring it means Karpenter takes a small node when one exists and a larger
        # one rather than nothing when none does -- which is the correct trade for a pool that
        # is spot-only by definition.
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: eks.amazonaws.com/instance-cpu
              operator: Lt
              values: ['17']
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: k8s.dask.org/dedicated
      operator: Equal
      value: worker
      effect: NoSchedule
    retryStrategy: {limit: 1, retryPolicy: OnError}
    volumes:
    # Same kind of volume infer-chunk stages the cube into, so the probe above measures the
    # thing that will actually hold it. Small: the probe writes 1,5 GB.
    - name: scratch
      emptyDir:
        sizeLimit: 8Gi

  - name: check-access
    inputs:
      parameters:
      # Whether this run will reach a GPU pod. build-only never does, so it must not be held
      # up by a CUDA tag it will never use.
      - name: require-gpu
    script:
      command: [sh]
      image: '{{workflow.parameters.aws-image}}'
      resources:
        limits: {cpu: 200m, memory: 256Mi}
        requests: {cpu: 200m, memory: 256Mi}
      source: |
        set -eux
        echo "biodiv-cube {{workflow.name}}" > /tmp/preflight.txt
        # The cube prefix is new, so it is the one this must actually prove writable.
        aws s3 cp /tmp/preflight.txt "{{workflow.parameters.s3-cube}}/_preflight/{{workflow.name}}.txt"
        aws s3 cp /tmp/preflight.txt "{{workflow.parameters.s3-dest}}/_preflight/{{workflow.name}}.txt"
        aws s3 ls "{{workflow.parameters.s3-assets}}/tiles/{{workflow.parameters.tiles-csv-name}}"
        # Fail now, not after the build stage. Under `main` the GPU pods are the LAST thing to
        # run, so an unset CUDA tag would otherwise surface hours in, with the whole cube built
        # and every GPU pod dying on ImagePullBackOff.
        # Fail in the first second rather than after the build stage. Under `main` the GPU
        # pods are the LAST thing to run, so an empty CUDA tag would otherwise surface hours
        # in, with the whole cube built and every GPU pod dying on ImagePullBackOff.
        if [ "{{inputs.parameters.require-gpu}}" = "true" ] \
           && [ -z "{{workflow.parameters.cuda-tag}}" ]; then
          echo "cuda-tag is empty; submit with -p cuda-tag=13-2-1 (hyphens, not dots)" >&2
          echo "  (a build-only run does not need it: argo submit --entrypoint build-only)" >&2
          exit 1
        fi

  - name: list-to-build
    container:
      image: '{{workflow.parameters.light-image}}'
      command: [bash, -c]
      args:
      - |
        python /git/repo/scripts/argo/cube_progress.py \
          --tiles-csv "/work/assets/tiles/{{workflow.parameters.tiles-csv-name}}" \
          --s3-cube "{{workflow.parameters.s3-cube}}" \
          --years "{{workflow.parameters.years}}" \
          --limit "{{workflow.parameters.limit-tiles}}" \
          --out /work/missing_tiles.csv
      env:
      - name: PYTHONPATH
        value: /git/repo/src
      resources:
        limits: {cpu: 1750m, memory: 3584Mi}
        requests: {cpu: 1750m, memory: 3584Mi}
      volumeMounts:
      - {mountPath: /work, name: work}
      - {mountPath: /git, name: git-data}
    initContainers:
    - name: git-sync
      image: '{{workflow.parameters.git-image}}'
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -c]
      args:
      - |
        exec /git-sync --repo="{{workflow.parameters.repo-url}}" \
          --ref="{{workflow.parameters.repo-branch}}" \
          --root=/git --link=repo --one-time --depth=1
      volumeMounts:
      - {mountPath: /git, name: git-data}
    - name: stage-tiles
      image: '{{workflow.parameters.aws-image}}'
      command: [sh, -c]
      args:
      - |
        set -eux
        mkdir -p /work/assets/tiles
        aws s3 cp "{{workflow.parameters.s3-assets}}/tiles/{{workflow.parameters.tiles-csv-name}}" /work/assets/tiles/
      volumeMounts:
      - {mountPath: /work, name: work}
    outputs:
      artifacts:
      - name: missing-csv
        path: /work/missing_tiles.csv
    retryStrategy: {limit: 2, retryPolicy: OnError}
    volumes:
    - {name: git-data, emptyDir: {}}
    - {name: work, emptyDir: {}}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}

  - name: list-missing-maps
    container:
      image: '{{workflow.parameters.light-image}}'
      command: [bash, -c]
      args:
      - |
        python /git/repo/scripts/argo/tile_progress.py \
          --tiles-csv "/work/assets/tiles/{{workflow.parameters.tiles-csv-name}}" \
          --s3-dest "{{workflow.parameters.s3-dest}}" \
          --years "{{workflow.parameters.years}}" \
          --limit "{{workflow.parameters.limit-tiles}}" \
          --out /work/missing_tiles.csv
      env:
      - name: PYTHONPATH
        value: /git/repo/src
      resources:
        limits: {cpu: 1750m, memory: 3584Mi}
        requests: {cpu: 1750m, memory: 3584Mi}
      volumeMounts:
      - {mountPath: /work, name: work}
      - {mountPath: /git, name: git-data}
    initContainers:
    - name: git-sync
      image: '{{workflow.parameters.git-image}}'
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -c]
      args:
      - |
        exec /git-sync --repo="{{workflow.parameters.repo-url}}" \
          --ref="{{workflow.parameters.repo-branch}}" \
          --root=/git --link=repo --one-time --depth=1
      volumeMounts:
      - {mountPath: /git, name: git-data}
    - name: stage-tiles
      image: '{{workflow.parameters.aws-image}}'
      command: [sh, -c]
      args:
      - |
        set -eux
        mkdir -p /work/assets/tiles
        aws s3 cp "{{workflow.parameters.s3-assets}}/tiles/{{workflow.parameters.tiles-csv-name}}" /work/assets/tiles/
      volumeMounts:
      - {mountPath: /work, name: work}
    outputs:
      artifacts:
      - name: missing-csv
        path: /work/missing_tiles.csv
    retryStrategy: {limit: 2, retryPolicy: OnError}
    volumes:
    - {name: git-data, emptyDir: {}}
    - {name: work, emptyDir: {}}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}

  # Shared by both stages: same input columns, same output shape.
  - name: split-tiles
    inputs:
      artifacts:
      - name: missing-csv
        path: /work/missing_tiles.csv
    container:
      image: '{{workflow.parameters.light-image}}'
      command: [python, -c]
      args:
      - |
        import csv, json, math, os

        rows = list(csv.reader(open("/work/missing_tiles.csv")))
        header, rows = rows[0], rows[1:]
        n = int(os.environ["NUM_CHUNKS"])
        os.makedirs("/work/chunks", exist_ok=True)
        size = math.ceil(len(rows) / n) if rows else 0
        ids = []
        for i in range(n):
            part = rows[i * size:(i + 1) * size] if size else []
            if not part:
                continue
            ids.append(str(i))
            with open(f"/work/chunks/chunk_{i}.csv", "w", newline="") as f:
                w = csv.writer(f)
                w.writerow(header)
                w.writerows(part)
        json.dump(ids, open("/work/chunk_ids.json", "w"))
      env:
      - name: NUM_CHUNKS
        value: '{{workflow.parameters.num-chunks}}'
      resources:
        limits: {cpu: 500m, memory: 512Mi}
        requests: {cpu: 500m, memory: 512Mi}
      volumeMounts:
      - {mountPath: /work, name: work}
    outputs:
      artifacts:
      - name: chunks
        path: /work/chunks
      parameters:
      - name: chunk-ids
        valueFrom: {path: /work/chunk_ids.json}
    volumes:
    - {name: work, emptyDir: {}}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}

  - name: build-chunk
    activeDeadlineSeconds: '{{workflow.parameters.build-deadline-seconds}}'
    inputs:
      artifacts:
      - name: chunks
        path: /work/chunks
      parameters:
      - name: chunk-id
    container:
      image: '{{workflow.parameters.base-image}}'
      command: [bash, -c]
      workingDir: /git/repo
      args:
      - |
        set -uo pipefail
        rc=0
        python scripts/75_build_cube.py \
          --tiles-file "/work/chunks/chunk_{{inputs.parameters.chunk-id}}.csv" \
          --cube "{{workflow.parameters.s3-cube}}" \
          --years "{{workflow.parameters.years}}" \
          --workers "{{workflow.parameters.build-workers}}" \
          --resume \
          --out /work/out \
          --tag "{{workflow.parameters.tag}}-build-{{inputs.parameters.chunk-id}}" || rc=$?
        # The manifest is the only per-tile record of which tiles failed and why; without this
        # copy it dies with the pod and the stores in S3 have no provenance. Uploaded whether
        # or not the pass succeeded -- a failed chunk is exactly when it is worth having.
        python scripts/argo/upload_run_evidence.py /work/out \
          "{{workflow.parameters.s3-cube}}/_runs/{{workflow.name}}/chunk-{{inputs.parameters.chunk-id}}" \
          || echo "WARNING: run evidence was not uploaded" >&2
        exit $rc
      env:
      - name: PYTHONPATH
        value: /git/repo/src
      - name: ODC_CONFIG_PATH
        value: /secret/dc/.datacube.conf
      - name: DATACUBE_CONFIG_PATH
        value: /secret/dc/.datacube.conf
      # usgs-landsat is requester-pays. configure_s3_access registers only a DEFAULT rio
      # config, which does not override a rasterio.Env already active on a thread; GDAL reads
      # these from the environment directly, so setting them here holds on every thread of
      # every dask worker.
      - name: AWS_REQUEST_PAYER
        value: requester
      - name: AWS_DEFAULT_REGION
        value: us-west-2
      # Scene paths come out of the ODC index already resolved, so GDAL never needs to list a
      # directory. Off means one less round trip per band, and s3:GetObject without ListBucket.
      - name: GDAL_DISABLE_READDIR_ON_OPEN
        value: EMPTY_DIR
      resources:
        # Same shape as process_argo.yaml's pod, which is proven on this cluster. 7 cores for
        # --workers 7; the driver holds ~820 MB per tile at 27 years (load_tile does .compute(),
        # so the array does come back to the driver -- see docs/24 sec. 3) plus the load
        # transient in the workers.
        limits: {cpu: '7', memory: 30Gi}
        requests: {cpu: '7', memory: 30Gi}
      volumeMounts:
      - {mountPath: /work, name: work}
      - {mountPath: /git, name: git-data}
      - {mountPath: /secret/dc, name: db-config}
    initContainers:
    - name: git-sync
      image: '{{workflow.parameters.git-image}}'
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -c]
      args:
      - |
        exec /git-sync --repo="{{workflow.parameters.repo-url}}" \
          --ref="{{workflow.parameters.repo-branch}}" \
          --root=/git --link=repo --one-time --depth=1
      volumeMounts:
      - {mountPath: /git, name: git-data}
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: 'true'
    outputs:
      artifacts:
      - name: run-evidence
        optional: true
        path: /work/out
    retryStrategy: {limit: 2, retryPolicy: OnError}
    volumes:
    - {name: git-data, emptyDir: {}}
    - {name: work, emptyDir: {}}
    - name: db-config
      secret:
        secretName: '{{workflow.parameters.db-config-secret}}'
        items:
        - {key: .datacube.conf, path: .datacube.conf}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}

  - name: infer-chunk
    activeDeadlineSeconds: '{{workflow.parameters.infer-deadline-seconds}}'
    inputs:
      artifacts:
      - name: chunks
        path: /work/chunks
      parameters:
      - name: chunk-id
    container:
      image: '{{workflow.parameters.gpu-registry}}/easi-workflows-base-nvidia-{{workflow.parameters.cuda-tag}}-torch-cudnn-runtime:{{workflow.parameters.gpu-image-tag}}'
      command: [bash, -c]
      workingDir: /git/repo
      args:
      - |
        set -uo pipefail
        rc=0
        # Pull this chunk's stores to node-local disk first. Reading them there is 0,49 s a
        # tile against 3,1 s straight from S3 (docs/21 8.16), which is worth having on a node
        # billed at GPU rates. Without --allow-missing a tile absent from the cube fails the
        # pod, which is what you want when the build pass is supposed to have finished.
        python scripts/argo/stage_cube.py \
          --tiles-file "/work/chunks/chunk_{{inputs.parameters.chunk-id}}.csv" \
          --s3-cube "{{workflow.parameters.s3-cube}}" \
          --years "{{workflow.parameters.years}}" \
          --dest /scratch/cube || exit $?

        python scripts/73_map_inference.py \
          --tiles-file "/work/chunks/chunk_{{inputs.parameters.chunk-id}}.csv" \
          --dest "{{workflow.parameters.s3-dest}}" \
          --mapbiomas-dir "{{workflow.parameters.s3-mapbiomas}}" \
          --ckpt-dir /work/assets/models/final \
          --oof-csv /work/assets/models/oof_predictions.csv \
          --derived /work/assets/derived \
          --area-m2 "{{workflow.parameters.area-m2}}" \
          --years "{{workflow.parameters.years}}" \
          --out /work/out \
          --resume \
          --workers 0 \
          --jobs "{{workflow.parameters.infer-jobs}}" \
          --load-threads 0 \
          --torch-threads 1 \
          --device cuda \
          --tag "{{workflow.parameters.tag}}-infer-{{inputs.parameters.chunk-id}}" || rc=$?
        python scripts/argo/upload_run_evidence.py /work/out \
          "{{workflow.parameters.s3-dest}}/_runs/{{workflow.name}}/chunk-{{inputs.parameters.chunk-id}}" \
          || echo "WARNING: run evidence was not uploaded" >&2
        exit $rc
      env:
      - name: PYTHONPATH
        value: /git/repo/src
      - name: ODC_CONFIG_PATH
        value: /secret/dc/.datacube.conf
      - name: DATACUBE_CONFIG_PATH
        value: /secret/dc/.datacube.conf
      - name: BIODIV_UNIFIED
        value: '1'
      - name: BIODIV_CURVES
        value: _raw100
      # The cube, staged locally above. load_tile consults this BEFORE dc.load, so with it set
      # the run never opens a COG -- and --load-threads 0 above means a tile somehow missing
      # from the cube would fall back to the slow synchronous load rather than quietly costing
      # a normal one. stage_cube.py fails the pod first, which is the intended guard.
      - name: BIODIV_TILE_ZARR
        value: /scratch/cube
      - name: AWS_DEFAULT_REGION
        value: us-west-2
      - name: GDAL_DISABLE_READDIR_ON_OPEN
        value: EMPTY_DIR
      resources:
        # docs/21 8.15: the knee is 4-6 processes per T4, ~640 MiB of VRAM each, and each
        # process wants ~1 vCPU for the residue -- so a small GPU with 8 vCPU is the shape that
        # fits (g4dn.2xlarge, g5.2xlarge), not a large or multi-GPU node.
        #
        # 6 CPU / 20Gi: what the work needs, with margin, on the smallest shape we would want.
        # --jobs 4 wants ~4 processes at ~1 vCPU each plus residue, and from the cube there is no
        # COG load transient at all -- the array is ~820 MB per process and the interpolation was
        # cut to 294 MiB (docs/21 8.8), so four processes sit near ~8 GB. The remaining ~12 GiB
        # is headroom for the page cache holding the staged cube (~6 GB at 18 tiles).
        #
        # A CORRECTION worth keeping, because the wrong version of it was in this file: the
        # earlier 7 CPU / 24Gi request was NOT why the first run landed on a g4dn.8xlarge. A real
        # node description settled it -- on Bottlerocket (EKS Auto) a 32 vCPU node reports 31700m
        # allocatable, i.e. only 300m of kubelet overhead, and the DaemonSets here total just
        # 155m CPU / 372Mi (node-exporter, the two secrets-store CSI pods, efs-csi, s3-csi). Not
        # the 500-1000m assumed. Extrapolated to an 8 vCPU node that leaves ~7645m schedulable,
        # so 7155m fitted comfortably. Both the 8xlarge and the later unschedulable pod were
        # purely spot OFFERING availability, which is what the affinity comment now says.
        # Sizing headroom on this cluster is therefore cheaper than intuition suggests.
        limits: {cpu: '6', memory: 20Gi, nvidia.com/gpu: 1}
        requests: {cpu: '6', memory: 20Gi, nvidia.com/gpu: 1}
      volumeMounts:
      - {mountPath: /work, name: work}
      - {mountPath: /git, name: git-data}
      - {mountPath: /secret/dc, name: db-config}
      - {mountPath: /scratch, name: scratch}
    initContainers:
    - name: git-sync
      image: '{{workflow.parameters.git-image}}'
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -c]
      args:
      - |
        exec /git-sync --repo="{{workflow.parameters.repo-url}}" \
          --ref="{{workflow.parameters.repo-branch}}" \
          --root=/git --link=repo --one-time --depth=1
      volumeMounts:
      - {mountPath: /git, name: git-data}
    - name: stage-assets
      image: '{{workflow.parameters.aws-image}}'
      command: [sh, -c]
      args:
      - |
        set -eux
        mkdir -p /work/assets
        aws s3 sync "{{workflow.parameters.s3-assets}}/models"  /work/assets/models
        aws s3 sync "{{workflow.parameters.s3-assets}}/derived" /work/assets/derived
      volumeMounts:
      - {mountPath: /work, name: work}
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: 'true'
    # UNVERIFIED: how this cluster expresses "give me a GPU node". The nvidia.com/gpu resource
    # above is the standard request and is usually enough with a device plugin installed; the
    # toleration below is the common NVIDIA taint. If the cluster labels GPU nodes instead, add
    # a nodeSelector here. Confirm before the first submit -- see the header.
    # ---- scheduling onto dask-gpu-worker-node-pool -------------------------------------
    # Reuses the existing Karpenter pool "dask-gpu-worker-node-pool" (spot, instance-category
    # p/g, amd64). There is no dedicated pool for this job and that pool has ample limits
    # (480 CPU / 60 GPU) and sits at 0 nodes, so it scales from zero on demand.
    #
    # The pool carries TWO taints and BOTH must be tolerated or nothing schedules at all:
    #   nvidia.com/gpu=true:NoSchedule
    #   k8s.dask.org/dedicated=worker:NoSchedule   <- easy to miss; it is the dask-only gate
    # Tolerating the second means borrowing a pool described as "dedicated ... for dask worker
    # Pods". That is fine mechanically -- a taint is only a gate -- but it is a borrowed pool,
    # so if the team ever needs it to be genuinely dask-only, this is the workflow to move.
    nodeSelector:
      # Targets that pool specifically rather than any GPU node that happens to exist.
      k8s.dask.org/node-purpose: worker
      # amd64 because the image index holds only linux/amd64 (see gpu-image-tag). The pool
      # already requires amd64, so this is agreement rather than a new constraint.
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            # THE IMPORTANT ONE. The pool allows l40s, l4, a10g, t4 AND v100. A V100 is Volta,
            # compute capability sm_70, which CUDA 13 dropped -- so a cheap spot V100 would
            # pull the image fine, see the GPU fine, and then die at the first forward with
            # "no kernel image is available for execution on the device". The other four are
            # sm_75 (t4), sm_86 (a10g) and sm_89 (l4, l40s), all of which CUDA 13 keeps.
            # This is what turns that failure from likely-on-spot into impossible.
            - key: eks.amazonaws.com/instance-gpu-name
              operator: NotIn
              values: [v100]
            # One GPU per node. The pool permits up to 4, and docs/21 8.15 measured the knee at
            # 4-6 processes on a SINGLE card with ~1 vCPU each -- so a 4-GPU node would be
            # about 4x over-provisioned and three cards would sit idle. Plenty of single-GPU
            # shapes exist (g4dn, g5, g6), so this does not meaningfully narrow spot choice.
            - key: eks.amazonaws.com/instance-gpu-count
              operator: In
              values: ['1']
            # Local NVMe: a cheap improvement, not a prerequisite. Measured (docs/21 8.16),
            # per tile at --jobs 4: reading straight from S3 costs 8,3 s (four readers contend;
            # 3,1 s solo), staging costs 2,7 s of transfer plus 0,47 s to read back warm or
            # 2,50 s genuinely cold on a ~134 MB/s disk. So staging wins either way -- 2,6x warm,
            # 1,6x cold -- and NVMe buys the difference between those two. It also covers the
            # case where a chunk outgrows the page cache, which at the default 18 tiles it does
            # not: ~6 GB staged against a 24Gi limit with ~8 GB of work. Every shape that
            # survives the two filters above
            # (g4dn, g5, g6, g6e) carries >=125 GB of it, so this narrows nothing in practice;
            # it excludes p3, which is EBS-only, and which the v100 filter already excluded.
            # 100 GB leaves room for a CUDA image plus the staged chunk several times over.
            #
            # CAVEAT: this guarantees the INSTANCE has NVMe, not that the emptyDir lands on it
            # -- that depends on the NodeClass wiring the instance store into the kubelet's
            # dataroot. EKS Auto Mode NodeClasses generally do this automatically, but this pool
            # uses a shared one and it is not verifiable from here, so gpu-preflight measures
            # the scratch volume directly rather than assuming.
            - key: eks.amazonaws.com/instance-local-nvme
              operator: Gt
              values: ['100']
        # Node SIZE is a PREFERENCE, not a requirement, and the split above/below is the whole
        # lesson from two failed attempts at this.
        #
        # The first gpu-check landed on a g4dn.8xlarge: 32 vCPU around a SINGLE T4, ~3x the
        # price of a 2xlarge for the same one card. Making <=16 vCPU a hard requirement then
        # made the pod UNSCHEDULABLE -- "no instance type which had enough resources and the
        # required offering met the scheduling requirements" -- even though six single-GPU
        # shapes satisfy it on paper (g4dn/g5/g6 2xlarge and 4xlarge). The operative word is
        # OFFERING: instance type x zone x spot. The small single-GPU shapes simply had no spot
        # capacity in these zones, while the 32-vCPU one did. That is market weather, and
        # encoding it as a hard constraint means the run stops whenever the weather changes.
        #
        # So: the things above are CORRECTNESS and stay hard -- a v100 would fail at the first
        # forward (no sm_70 kernels, confirmed in logs/bench_gpu_preflight.log), a multi-GPU
        # node wastes cards, and without local NVMe staging the cube stops paying. Size is only
        # COST. Preferring it means Karpenter takes a small node when one exists and a larger
        # one rather than nothing when none does -- which is the correct trade for a pool that
        # is spot-only by definition.
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: eks.amazonaws.com/instance-cpu
              operator: Lt
              values: ['17']
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: k8s.dask.org/dedicated
      operator: Equal
      value: worker
      effect: NoSchedule
    outputs:
      artifacts:
      - name: run-evidence
        optional: true
        path: /work/out
    retryStrategy: {limit: 2, retryPolicy: OnError}
    volumes:
    - {name: git-data, emptyDir: {}}
    - {name: work, emptyDir: {}}
    # Node-local disk for the staged cube. 18 tiles x ~392 MB at 27 years is ~7 GB, so 32Gi is
    # over four times what a default chunk needs while staying small enough not to push
    # Karpenter onto a bigger instance for ephemeral storage alone. Raise it if tiles-per-pod
    # goes up a lot. This is disk, so it does not count against the memory above.
    #
    # THIS IS NOT A REQUEST FOR SSD, AND THERE IS NO WAY TO MAKE IT ONE FROM HERE. An
    # `ephemeral-storage` request is a quota against whatever filesystem the kubelet already
    # has -- it selects no device class. On EKS an emptyDir lands on the kubelet root volume,
    # normally gp3 EBS, even on g4dn/g5 shapes that ship local NVMe; using the instance store
    # takes `instanceStorePolicy` on the NodeClass, and this pool points at a SHARED NodeClass
    # ("default"), so that is a cluster-level change and not ours to make casually.
    #
    # How much it matters, measured (docs/21 8.16): a chunked store reads in 0,48 s and that is
    # DECOMPRESSION-bound, not I/O-bound -- evicting the page cache with posix_fadvise changed
    # it by 0,03 s. To keep it decompression-bound the disk must supply ~700 MB/s. Local NVMe
    # does; gp3 at its 125 MB/s baseline does not, and would make the same read ~2,7 s. Note
    # what that does and does not cost: ~2,7 s is still no worse than the 3,1 s of reading
    # straight from S3, so staging never loses -- it just stops winning. stage_cube.py prints
    # its own throughput, so the first real run says which regime this pool is in.
    #
    # If it turns out to be slow and the win is wanted, the switch that needs no cluster change
    # is `medium: Memory` here (tmpfs, RAM-speed). It is left off by default because tmpfs
    # counts against the pod's memory limit, which silently couples this volume to
    # tiles-per-pod: ~7 GB at 18 tiles fits inside 24Gi alongside ~8 GB of processes, but a
    # bigger chunk would OOM the pod rather than fill a disk.
    - name: scratch
      emptyDir:
        # tiles-per-pod x ~392 MB is the staged cube: ~7 GB at the default 18 tiles, ~36 GB if
        # a chunk ever carried 90. 64Gi covers both with room to spare and sits comfortably
        # inside the 225 GB of NVMe on a g4dn.2xlarge once the CUDA image (~10-20 GB) is
        # allowed for. Capacity is not the binding constraint here -- throughput is, which is
        # what the instance-local-nvme requirement above is for.
        sizeLimit: 64Gi
    - name: db-config
      secret:
        secretName: '{{workflow.parameters.db-config-secret}}'
        items:
        - {key: .datacube.conf, path: .datacube.conf}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}
  # artifactGC is OnWorkflowDeletion, so this is also the window in which
  # `argo cp ... --artifact-name run-evidence` still works. The S3 copies under _runs/ survive
  # either way; this only governs the Argo-side copy.
  ttlStrategy:
    secondsAfterSuccess: 86400
