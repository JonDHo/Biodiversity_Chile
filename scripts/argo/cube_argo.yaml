# biodiv-cube -- build the materialised kNDVI cube, then infer from it.
#
#   argo submit -n easi-workflows-argo scripts/argo/cube_argo.yaml \
#     -p limit-tiles=90 -p num-chunks=5
#
# This is `docs/24` Option A: one construction pass on cheap CPU, then all inference against
# the cube on a small GPU node. It is SEPARATE from process_argo.yaml, which stays as the
# working path that reads COGs directly -- nothing here modifies it, and either can be run.
#
# ---------------------------------------------------------------------
# Three entrypoints, because the two stages are worth running apart
# ---------------------------------------------------------------------
#   main         build everything, then infer. The default, and biphasic: infer-chunk depends
#                on build-chunk, so NO tile is inferred until EVERY tile is built.
#   build-only   the construction pass alone (`argo submit --entrypoint build-only`)
#   infer-only   inference alone, against whatever the cube already holds
#
# **On overlapping the two.** The stages are 1-to-1 per tile, so waiting for the whole build is
# not technically necessary, and the wall-time case for overlapping is real: total goes from
# build+infer to max(build, infer). The ratio is what decides it. A build pod produces a tile
# every ~360 s (27 years, --workers 7, extrapolated from the 292,2 s measured at 22 years in
# `docs/21` 8.17); a GPU node at --jobs 4 retires one every ~17,5 s. So ONE GPU NODE NEEDS
# ~20 BUILD PODS to stay fed. Below that ratio the GPU idles at GPU prices, which is the same
# error `docs/24` 3 rejected when it killed the bundled --write-cube plan.
#
# It is deliberately not the default for the first run, and `docs/24` 5 says why: resist
# pipelining until A has run once. Overlapping loses nothing durable -- the stores land in S3
# either way, so re-runs stay cheap -- but it does mean a bad cube is consumed before anyone
# can look at it, and the build pass has never run at scale. Once it has, overlapping is
# `argo submit --entrypoint infer-only` alongside a running build, with no edit to this file:
# cube_progress.py and tile_progress.py both answer "what is ready" by listing S3, so a polling
# pipeline falls out of the tooling that already exists.
#
# ---------------------------------------------------------------------
# What each stage costs, measured
# ---------------------------------------------------------------------
# build-chunk  ~360 s/tile (27 years). The scheduler is `--workers 7`, NOT the `--load-threads`
#              that process_argo.yaml uses: that setting is tuned around the CNN competing with
#              the cluster's workers, and this pass has no CNN. Measured 688,8 s -> 292,2 s,
#              2,36x, rasters bit-identical between the two (`docs/21` 8.17).
# infer-chunk  ~70 s/tile at --jobs 4 on one T4, from the cube (`docs/21` 8.15). The stores are
#              pulled to node-local disk first by stage_cube.py: reading them there is 0,49 s a
#              tile against 3,1 s direct from S3 (`docs/21` 8.16), which turns a ~13 % read tax
#              into ~4 %. Staging measured 115 MB/s, ~2,7 s a tile.
#
# Dedup, both stages, same principle as process_argo.yaml: no separate progress tracker, S3 is
# the source of truth. cube_progress.py treats a tile as built only when its store carries the
# completion marker -- zarr_write writes the group attributes last, so a build killed mid-write
# reads as absent rather than as a short tile, and gets rebuilt.
#
# Sizing: build-deadline-seconds must cover (tiles per pod) x ~360 s, and
# infer-deadline-seconds (tiles per pod) x ~70 s plus the one-off staging.
#
# ---------------------------------------------------------------------
# UNVERIFIED FROM OUTSIDE THE CLUSTER -- check these two before the first submit
# ---------------------------------------------------------------------
#  1. The GPU scheduling hints (the toleration under infer-chunk, and whether this cluster
#     also wants a nodeSelector). The CPU images and pod shape here are the ones
#     process_argo.yaml already proves; the GPU node labels cannot be read from a CPU pod.
#  2. cuda-tag is set to 13-2-1, which was current on 2026-09-11 and is not something this
#     file can re-check for itself. If GPU pods fail to pull, that is the first thing to look
#     at -- and note it is hyphenated, since it is part of the repository name.
#  (S3 is NOT a question: the easi-workflows-team service account carries access to every
#   prefix below easi-workflows-team/, so the new cube/ prefix is covered like the rest.
#   check-access still writes a preflight object to it, which costs nothing and localises a
#   credential problem to the first second of the run.)
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: biodiv-cube-
  namespace: easi-workflows-argo
  labels:
    name: biodiv-cube
    owner: jlopatin
    team: easi-workflows-team
spec:
  arguments:
    parameters:
    # Only build-chunk needs this one. `import biodiv.maptask` pulls torch in through
    # mapinfer -- verified, not assumed -- so the build pod cannot use the light image even
    # though the build itself never runs a model. Making mapinfer's torch import lazy would
    # free it, which is worth considering if spot churn makes pod startup matter: the build
    # pass is meant for the cheapest capacity going, and that is the capacity that restarts.
    - name: base-image
      value: 444488357543.dkr.ecr.us-west-2.amazonaws.com/easi-workflows-base-torch-cpu:develop.latest
    # The list and split steps need boto3 and the standard library, nothing else: they read
    # and write CSVs and call S3. cube_progress.py deliberately does not import `biodiv` at
    # all (it repeats the store-name convention instead), which is what lets them run here.
    # UNVERIFIED name, but cheap to get wrong -- these steps fail within seconds of the
    # submit, unlike the GPU image, which is why that one gets a preflight and this does not.
    - name: light-image
      value: 444488357543.dkr.ecr.us-west-2.amazonaws.com/easi-workflows-base:develop.latest
    # The GPU image is composed from cuda-tag rather than written out, because the CUDA
    # version is the only part anyone needs to change and it is the part nobody can guess.
    # The repository is easi-workflows-base-nvidia-<CUDA_TAG>-torch-cudnn-runtime.
    - name: gpu-registry
      value: 444488357543.dkr.ecr.us-west-2.amazonaws.com
    # NOTE THE HYPHENS: the CUDA version appears as 13-2-1, not 13.2.1, because it is part of
    # a repository name. 13-2-1 was current on 2026-09-11; it moves, so check before a run
    # after a long gap. It is not discoverable from a Jupyter pod -- the registry is in account
    # 444488357543 while the notebook role lives in 262301216538, so ecr:DescribeRepositories
    # is denied cross-account. To re-check, with credentials for the workflows account:
    #
    #   # which CUDA versions exist -- each is its OWN repository, the version is in the name
    #   aws ecr describe-repositories --registry-id 444488357543 --region us-west-2 \
    #     --query 'repositories[?contains(repositoryName, `nvidia`)].repositoryName' --output table
    #
    #   # which tags exist inside one, newest last
    #   aws ecr describe-images --registry-id 444488357543 --region us-west-2 \
    #     --repository-name easi-workflows-base-nvidia-13-2-1-torch-cudnn-runtime \
    #     --query 'sort_by(imageDetails,&imagePushedAt)[].[imagePushedAt,imageTags[0]]' --output table
    #
    # Or, if ECR is denied but the cluster is reachable, ask a running pod what it uses:
    #   kubectl -n easi-workflows-argo get pods \
    #     -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' | sort -u | grep -i nvidia
    #
    # gpu-preflight below is what actually settles it: it pulls this exact image and fails in
    # a minute if the tag is wrong, rather than at the end of a `main` run.
    - name: cuda-tag
      value: 13-2-1
    # The repository NAME is confirmed; this image TAG is assumed, by analogy with the CPU
    # base-image above. If the pull fails on a repository that exists, try this first.
    - name: gpu-image-tag
      value: develop.latest
    - name: aws-image
      value: amazon/aws-cli:2.17.62
    - name: repo-url
      value: https://github.com/JavierLopatin/Biodiversity_Chile.git
    - name: repo-branch
      value: main
    - name: git-image
      value: registry.k8s.io/git-sync/git-sync:v4.5.0
    - name: db-config-secret
      value: easi-odc-v2-user-db
    - name: s3-cube
      value: s3://easido-prod-dc-data-projects/easi-workflows-team/biodiv/cube/chile_30m
    - name: s3-dest
      value: s3://easido-prod-dc-data-projects/easi-workflows-team/biodiv/maps/chile_30m_2000_2026
    - name: s3-assets
      value: s3://easido-prod-dc-data-projects/easi-workflows-team/biodiv/assets
    - name: s3-mapbiomas
      value: s3://easido-prod-dc-data-projects/easi-workflows-team/biodiv/MapBiomas
    - name: tiles-csv-name
      value: tiles_native_10km.csv
    - name: years
      value: 2000-2026
    - name: area-m2
      value: '900'
    - name: tag
      value: cube-run1
    - name: limit-tiles
      value: '90'
    - name: num-chunks
      value: '5'
    - name: build-workers
      value: '7'
    - name: infer-jobs
      value: '4'
    - name: build-deadline-seconds
      value: '10800'
    - name: infer-deadline-seconds
      value: '7200'
  artifactGC:
    serviceAccountName: easi-workflows-team-sa-argo
    strategy: OnWorkflowDeletion
  entrypoint: main
  parallelism: 5
  podGC:
    strategy: OnWorkflowSuccess
  serviceAccountName: easi-workflows-team-sa-argo
  templates:

  # ---------------- DAGs ----------------
  - name: main
    dag:
      # If gpu-preflight fails, let the build stage run to completion anyway. The build is the
      # expensive half (~360 s a tile) and it is fully resumable, so throwing away partly-built
      # capacity to report a GPU problem sooner would be a poor trade -- the report is already
      # immediate, since the preflight runs alongside the build rather than after it. Fix the
      # image and submit --entrypoint infer-only against the cube that got built.
      # It also means one bad build chunk does not cancel the other four, which are independent.
      failFast: false
      tasks:
      - name: check-access
        template: check-access
        arguments:
          parameters:
          - name: require-gpu
            value: 'true'
      - name: gpu-preflight
        template: gpu-preflight
        depends: check-access
      - name: list-to-build
        template: list-to-build
        depends: check-access
      - name: split-build
        template: split-tiles
        depends: list-to-build
        arguments:
          artifacts:
          - name: missing-csv
            from: '{{tasks.list-to-build.outputs.artifacts.missing-csv}}'
      - name: build-chunk
        template: build-chunk
        depends: split-build
        withParam: '{{tasks.split-build.outputs.parameters.chunk-ids}}'
        arguments:
          artifacts:
          - name: chunks
            from: '{{tasks.split-build.outputs.artifacts.chunks}}'
          parameters:
          - name: chunk-id
            value: '{{item}}'
      # THE BARRIER. This one `depends` is what makes the run biphasic; every build-chunk pod
      # must finish before any inference starts. Removing it is not the way to overlap -- use
      # --entrypoint infer-only in a second submission instead, so the two stages keep their
      # own deadlines, parallelism and retries.
      - name: list-missing-maps
        template: list-missing-maps
        depends: build-chunk && gpu-preflight
      - name: split-infer
        template: split-tiles
        depends: list-missing-maps
        arguments:
          artifacts:
          - name: missing-csv
            from: '{{tasks.list-missing-maps.outputs.artifacts.missing-csv}}'
      - name: infer-chunk
        template: infer-chunk
        depends: split-infer
        withParam: '{{tasks.split-infer.outputs.parameters.chunk-ids}}'
        arguments:
          artifacts:
          - name: chunks
            from: '{{tasks.split-infer.outputs.artifacts.chunks}}'
          parameters:
          - name: chunk-id
            value: '{{item}}'

  - name: build-only
    dag:
      tasks:
      - name: check-access
        template: check-access
        arguments:
          parameters:
          - name: require-gpu
            value: 'false'
      - name: list-to-build
        template: list-to-build
        depends: check-access
      - name: split-build
        template: split-tiles
        depends: list-to-build
        arguments:
          artifacts:
          - name: missing-csv
            from: '{{tasks.list-to-build.outputs.artifacts.missing-csv}}'
      - name: build-chunk
        template: build-chunk
        depends: split-build
        withParam: '{{tasks.split-build.outputs.parameters.chunk-ids}}'
        arguments:
          artifacts:
          - name: chunks
            from: '{{tasks.split-build.outputs.artifacts.chunks}}'
          parameters:
          - name: chunk-id
            value: '{{item}}'

  - name: infer-only
    dag:
      tasks:
      - name: check-access
        template: check-access
        arguments:
          parameters:
          - name: require-gpu
            value: 'true'
      - name: gpu-preflight
        template: gpu-preflight
        depends: check-access
      - name: list-missing-maps
        template: list-missing-maps
        depends: gpu-preflight
      - name: split-infer
        template: split-tiles
        depends: list-missing-maps
        arguments:
          artifacts:
          - name: missing-csv
            from: '{{tasks.list-missing-maps.outputs.artifacts.missing-csv}}'
      - name: infer-chunk
        template: infer-chunk
        depends: split-infer
        withParam: '{{tasks.split-infer.outputs.parameters.chunk-ids}}'
        arguments:
          artifacts:
          - name: chunks
            from: '{{tasks.split-infer.outputs.artifacts.chunks}}'
          parameters:
          - name: chunk-id
            value: '{{item}}'

  # ---------------- steps ----------------
  # Proves, in about a minute and on one short-lived pod, the three things about the GPU side
  # that nothing else here can check: that the image name resolves and pulls, that the
  # scheduling hints actually get this workflow a GPU, and that the torch in that image can
  # run on the card it lands on. Under `main` the GPU pods are otherwise the LAST thing to
  # run, so without this any of the three would surface with the whole cube already built.
  #
  # The arch check is the non-obvious one. `cuda-tag` moves over time and newer CUDA releases
  # drop older GPU architectures, so an image can pull cleanly, see the card, and still have
  # no kernels for it -- torch then fails at the first forward with "no kernel image is
  # available for execution on the device", which is a confusing error to meet at hour six.
  # A T4 is compute capability 7.5; get_arch_list() is what says whether this build has it.
  - name: gpu-preflight
    activeDeadlineSeconds: '900'
    container:
      image: '{{workflow.parameters.gpu-registry}}/easi-workflows-base-nvidia-{{workflow.parameters.cuda-tag}}-torch-cudnn-runtime:{{workflow.parameters.gpu-image-tag}}'
      command: [python, -c]
      args:
      - |
        import sys, torch
        print("torch", torch.__version__, "built for CUDA", torch.version.cuda, flush=True)
        if not torch.cuda.is_available():
            sys.exit("no CUDA device visible: the pod did not get a GPU, or the image "
                     "cannot see it. Check the toleration/nodeSelector on infer-chunk.")
        name = torch.cuda.get_device_name(0)
        cap = torch.cuda.get_device_capability(0)
        archs = torch.cuda.get_arch_list()
        print(f"device: {name}  capability sm_{cap[0]}{cap[1]}", flush=True)
        print(f"kernels built for: {archs}", flush=True)
        if f"sm_{cap[0]}{cap[1]}" not in archs:
            sys.exit(f"this torch has no kernels for sm_{cap[0]}{cap[1]} ({name}). Pick an "
                     f"older cuda-tag, or a GPU this build supports.")
        # Actually run something, because is_available() alone has never proven a kernel runs.
        a = torch.randn(256, 256, device="cuda")
        print("matmul ok:", float((a @ a).sum()) == float((a @ a).sum()), flush=True)
        print("GPU PREFLIGHT OK", flush=True)
      resources:
        limits: {cpu: '1', memory: 4Gi, nvidia.com/gpu: 1}
        requests: {cpu: '1', memory: 4Gi, nvidia.com/gpu: 1}
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    retryStrategy: {limit: 1, retryPolicy: OnError}

  - name: check-access
    inputs:
      parameters:
      # Whether this run will reach a GPU pod. build-only never does, so it must not be held
      # up by a CUDA tag it will never use.
      - name: require-gpu
    script:
      command: [sh]
      image: '{{workflow.parameters.aws-image}}'
      resources:
        limits: {cpu: 200m, memory: 256Mi}
        requests: {cpu: 200m, memory: 256Mi}
      source: |
        set -eux
        echo "biodiv-cube {{workflow.name}}" > /tmp/preflight.txt
        # The cube prefix is new, so it is the one this must actually prove writable.
        aws s3 cp /tmp/preflight.txt "{{workflow.parameters.s3-cube}}/_preflight/{{workflow.name}}.txt"
        aws s3 cp /tmp/preflight.txt "{{workflow.parameters.s3-dest}}/_preflight/{{workflow.name}}.txt"
        aws s3 ls "{{workflow.parameters.s3-assets}}/tiles/{{workflow.parameters.tiles-csv-name}}"
        # Fail now, not after the build stage. Under `main` the GPU pods are the LAST thing to
        # run, so an unset CUDA tag would otherwise surface hours in, with the whole cube built
        # and every GPU pod dying on ImagePullBackOff.
        # Fail in the first second rather than after the build stage. Under `main` the GPU
        # pods are the LAST thing to run, so an empty CUDA tag would otherwise surface hours
        # in, with the whole cube built and every GPU pod dying on ImagePullBackOff.
        if [ "{{inputs.parameters.require-gpu}}" = "true" ] \
           && [ -z "{{workflow.parameters.cuda-tag}}" ]; then
          echo "cuda-tag is empty; submit with -p cuda-tag=13-2-1 (hyphens, not dots)" >&2
          echo "  (a build-only run does not need it: argo submit --entrypoint build-only)" >&2
          exit 1
        fi

  - name: list-to-build
    container:
      image: '{{workflow.parameters.light-image}}'
      command: [bash, -c]
      args:
      - |
        python /git/repo/scripts/argo/cube_progress.py \
          --tiles-csv "/work/assets/tiles/{{workflow.parameters.tiles-csv-name}}" \
          --s3-cube "{{workflow.parameters.s3-cube}}" \
          --years "{{workflow.parameters.years}}" \
          --limit "{{workflow.parameters.limit-tiles}}" \
          --out /work/missing_tiles.csv
      env:
      - name: PYTHONPATH
        value: /git/repo/src
      resources:
        limits: {cpu: 1750m, memory: 3584Mi}
        requests: {cpu: 1750m, memory: 3584Mi}
      volumeMounts:
      - {mountPath: /work, name: work}
      - {mountPath: /git, name: git-data}
    initContainers:
    - name: git-sync
      image: '{{workflow.parameters.git-image}}'
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -c]
      args:
      - |
        exec /git-sync --repo="{{workflow.parameters.repo-url}}" \
          --ref="{{workflow.parameters.repo-branch}}" \
          --root=/git --link=repo --one-time --depth=1
      volumeMounts:
      - {mountPath: /git, name: git-data}
    - name: stage-tiles
      image: '{{workflow.parameters.aws-image}}'
      command: [sh, -c]
      args:
      - |
        set -eux
        mkdir -p /work/assets/tiles
        aws s3 cp "{{workflow.parameters.s3-assets}}/tiles/{{workflow.parameters.tiles-csv-name}}" /work/assets/tiles/
      volumeMounts:
      - {mountPath: /work, name: work}
    outputs:
      artifacts:
      - name: missing-csv
        path: /work/missing_tiles.csv
    retryStrategy: {limit: 2, retryPolicy: OnError}
    volumes:
    - {name: git-data, emptyDir: {}}
    - {name: work, emptyDir: {}}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}

  - name: list-missing-maps
    container:
      image: '{{workflow.parameters.light-image}}'
      command: [bash, -c]
      args:
      - |
        python /git/repo/scripts/argo/tile_progress.py \
          --tiles-csv "/work/assets/tiles/{{workflow.parameters.tiles-csv-name}}" \
          --s3-dest "{{workflow.parameters.s3-dest}}" \
          --years "{{workflow.parameters.years}}" \
          --limit "{{workflow.parameters.limit-tiles}}" \
          --out /work/missing_tiles.csv
      env:
      - name: PYTHONPATH
        value: /git/repo/src
      resources:
        limits: {cpu: 1750m, memory: 3584Mi}
        requests: {cpu: 1750m, memory: 3584Mi}
      volumeMounts:
      - {mountPath: /work, name: work}
      - {mountPath: /git, name: git-data}
    initContainers:
    - name: git-sync
      image: '{{workflow.parameters.git-image}}'
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -c]
      args:
      - |
        exec /git-sync --repo="{{workflow.parameters.repo-url}}" \
          --ref="{{workflow.parameters.repo-branch}}" \
          --root=/git --link=repo --one-time --depth=1
      volumeMounts:
      - {mountPath: /git, name: git-data}
    - name: stage-tiles
      image: '{{workflow.parameters.aws-image}}'
      command: [sh, -c]
      args:
      - |
        set -eux
        mkdir -p /work/assets/tiles
        aws s3 cp "{{workflow.parameters.s3-assets}}/tiles/{{workflow.parameters.tiles-csv-name}}" /work/assets/tiles/
      volumeMounts:
      - {mountPath: /work, name: work}
    outputs:
      artifacts:
      - name: missing-csv
        path: /work/missing_tiles.csv
    retryStrategy: {limit: 2, retryPolicy: OnError}
    volumes:
    - {name: git-data, emptyDir: {}}
    - {name: work, emptyDir: {}}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}

  # Shared by both stages: same input columns, same output shape.
  - name: split-tiles
    inputs:
      artifacts:
      - name: missing-csv
        path: /work/missing_tiles.csv
    container:
      image: '{{workflow.parameters.light-image}}'
      command: [python, -c]
      args:
      - |
        import csv, json, math, os

        rows = list(csv.reader(open("/work/missing_tiles.csv")))
        header, rows = rows[0], rows[1:]
        n = int(os.environ["NUM_CHUNKS"])
        os.makedirs("/work/chunks", exist_ok=True)
        size = math.ceil(len(rows) / n) if rows else 0
        ids = []
        for i in range(n):
            part = rows[i * size:(i + 1) * size] if size else []
            if not part:
                continue
            ids.append(str(i))
            with open(f"/work/chunks/chunk_{i}.csv", "w", newline="") as f:
                w = csv.writer(f)
                w.writerow(header)
                w.writerows(part)
        json.dump(ids, open("/work/chunk_ids.json", "w"))
      env:
      - name: NUM_CHUNKS
        value: '{{workflow.parameters.num-chunks}}'
      resources:
        limits: {cpu: 500m, memory: 512Mi}
        requests: {cpu: 500m, memory: 512Mi}
      volumeMounts:
      - {mountPath: /work, name: work}
    outputs:
      artifacts:
      - name: chunks
        path: /work/chunks
      parameters:
      - name: chunk-ids
        valueFrom: {path: /work/chunk_ids.json}
    volumes:
    - {name: work, emptyDir: {}}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}

  - name: build-chunk
    activeDeadlineSeconds: '{{workflow.parameters.build-deadline-seconds}}'
    inputs:
      artifacts:
      - name: chunks
        path: /work/chunks
      parameters:
      - name: chunk-id
    container:
      image: '{{workflow.parameters.base-image}}'
      command: [bash, -c]
      workingDir: /git/repo
      args:
      - |
        set -uo pipefail
        rc=0
        python scripts/75_build_cube.py \
          --tiles-file "/work/chunks/chunk_{{inputs.parameters.chunk-id}}.csv" \
          --cube "{{workflow.parameters.s3-cube}}" \
          --years "{{workflow.parameters.years}}" \
          --workers "{{workflow.parameters.build-workers}}" \
          --resume \
          --out /work/out \
          --tag "{{workflow.parameters.tag}}-build-{{inputs.parameters.chunk-id}}" || rc=$?
        # The manifest is the only per-tile record of which tiles failed and why; without this
        # copy it dies with the pod and the stores in S3 have no provenance. Uploaded whether
        # or not the pass succeeded -- a failed chunk is exactly when it is worth having.
        python scripts/argo/upload_run_evidence.py /work/out \
          "{{workflow.parameters.s3-cube}}/_runs/{{workflow.name}}/chunk-{{inputs.parameters.chunk-id}}" \
          || echo "WARNING: run evidence was not uploaded" >&2
        exit $rc
      env:
      - name: PYTHONPATH
        value: /git/repo/src
      - name: ODC_CONFIG_PATH
        value: /secret/dc/.datacube.conf
      - name: DATACUBE_CONFIG_PATH
        value: /secret/dc/.datacube.conf
      # usgs-landsat is requester-pays. configure_s3_access registers only a DEFAULT rio
      # config, which does not override a rasterio.Env already active on a thread; GDAL reads
      # these from the environment directly, so setting them here holds on every thread of
      # every dask worker.
      - name: AWS_REQUEST_PAYER
        value: requester
      - name: AWS_DEFAULT_REGION
        value: us-west-2
      # Scene paths come out of the ODC index already resolved, so GDAL never needs to list a
      # directory. Off means one less round trip per band, and s3:GetObject without ListBucket.
      - name: GDAL_DISABLE_READDIR_ON_OPEN
        value: EMPTY_DIR
      resources:
        # Same shape as process_argo.yaml's pod, which is proven on this cluster. 7 cores for
        # --workers 7; the driver holds ~820 MB per tile at 27 years (load_tile does .compute(),
        # so the array does come back to the driver -- see docs/24 sec. 3) plus the load
        # transient in the workers.
        limits: {cpu: '7', memory: 30Gi}
        requests: {cpu: '7', memory: 30Gi}
      volumeMounts:
      - {mountPath: /work, name: work}
      - {mountPath: /git, name: git-data}
      - {mountPath: /secret/dc, name: db-config}
    initContainers:
    - name: git-sync
      image: '{{workflow.parameters.git-image}}'
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -c]
      args:
      - |
        exec /git-sync --repo="{{workflow.parameters.repo-url}}" \
          --ref="{{workflow.parameters.repo-branch}}" \
          --root=/git --link=repo --one-time --depth=1
      volumeMounts:
      - {mountPath: /git, name: git-data}
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: 'true'
    outputs:
      artifacts:
      - name: run-evidence
        optional: true
        path: /work/out
    retryStrategy: {limit: 2, retryPolicy: OnError}
    volumes:
    - {name: git-data, emptyDir: {}}
    - {name: work, emptyDir: {}}
    - name: db-config
      secret:
        secretName: '{{workflow.parameters.db-config-secret}}'
        items:
        - {key: .datacube.conf, path: .datacube.conf}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}

  - name: infer-chunk
    activeDeadlineSeconds: '{{workflow.parameters.infer-deadline-seconds}}'
    inputs:
      artifacts:
      - name: chunks
        path: /work/chunks
      parameters:
      - name: chunk-id
    container:
      image: '{{workflow.parameters.gpu-registry}}/easi-workflows-base-nvidia-{{workflow.parameters.cuda-tag}}-torch-cudnn-runtime:{{workflow.parameters.gpu-image-tag}}'
      command: [bash, -c]
      workingDir: /git/repo
      args:
      - |
        set -uo pipefail
        rc=0
        # Pull this chunk's stores to node-local disk first. Reading them there is 0,49 s a
        # tile against 3,1 s straight from S3 (docs/21 8.16), which is worth having on a node
        # billed at GPU rates. Without --allow-missing a tile absent from the cube fails the
        # pod, which is what you want when the build pass is supposed to have finished.
        python scripts/argo/stage_cube.py \
          --tiles-file "/work/chunks/chunk_{{inputs.parameters.chunk-id}}.csv" \
          --s3-cube "{{workflow.parameters.s3-cube}}" \
          --years "{{workflow.parameters.years}}" \
          --dest /scratch/cube || exit $?

        python scripts/73_map_inference.py \
          --tiles-file "/work/chunks/chunk_{{inputs.parameters.chunk-id}}.csv" \
          --dest "{{workflow.parameters.s3-dest}}" \
          --mapbiomas-dir "{{workflow.parameters.s3-mapbiomas}}" \
          --ckpt-dir /work/assets/models/final \
          --oof-csv /work/assets/models/oof_predictions.csv \
          --derived /work/assets/derived \
          --area-m2 "{{workflow.parameters.area-m2}}" \
          --years "{{workflow.parameters.years}}" \
          --out /work/out \
          --resume \
          --workers 0 \
          --jobs "{{workflow.parameters.infer-jobs}}" \
          --load-threads 0 \
          --torch-threads 1 \
          --device cuda \
          --tag "{{workflow.parameters.tag}}-infer-{{inputs.parameters.chunk-id}}" || rc=$?
        python scripts/argo/upload_run_evidence.py /work/out \
          "{{workflow.parameters.s3-dest}}/_runs/{{workflow.name}}/chunk-{{inputs.parameters.chunk-id}}" \
          || echo "WARNING: run evidence was not uploaded" >&2
        exit $rc
      env:
      - name: PYTHONPATH
        value: /git/repo/src
      - name: ODC_CONFIG_PATH
        value: /secret/dc/.datacube.conf
      - name: DATACUBE_CONFIG_PATH
        value: /secret/dc/.datacube.conf
      - name: BIODIV_UNIFIED
        value: '1'
      - name: BIODIV_CURVES
        value: _raw100
      # The cube, staged locally above. load_tile consults this BEFORE dc.load, so with it set
      # the run never opens a COG -- and --load-threads 0 above means a tile somehow missing
      # from the cube would fall back to the slow synchronous load rather than quietly costing
      # a normal one. stage_cube.py fails the pod first, which is the intended guard.
      - name: BIODIV_TILE_ZARR
        value: /scratch/cube
      - name: AWS_DEFAULT_REGION
        value: us-west-2
      - name: GDAL_DISABLE_READDIR_ON_OPEN
        value: EMPTY_DIR
      resources:
        # docs/21 8.15: the knee is 4-6 processes per T4, ~640 MiB of VRAM each, and each
        # process wants ~1 vCPU for the residue -- so a small GPU with 4-8 vCPU is the shape
        # that fits, not a large or multi-GPU node.
        limits: {cpu: '7', memory: 30Gi, nvidia.com/gpu: 1}
        requests: {cpu: '7', memory: 30Gi, nvidia.com/gpu: 1}
      volumeMounts:
      - {mountPath: /work, name: work}
      - {mountPath: /git, name: git-data}
      - {mountPath: /secret/dc, name: db-config}
      - {mountPath: /scratch, name: scratch}
    initContainers:
    - name: git-sync
      image: '{{workflow.parameters.git-image}}'
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, -c]
      args:
      - |
        exec /git-sync --repo="{{workflow.parameters.repo-url}}" \
          --ref="{{workflow.parameters.repo-branch}}" \
          --root=/git --link=repo --one-time --depth=1
      volumeMounts:
      - {mountPath: /git, name: git-data}
    - name: stage-assets
      image: '{{workflow.parameters.aws-image}}'
      command: [sh, -c]
      args:
      - |
        set -eux
        mkdir -p /work/assets
        aws s3 sync "{{workflow.parameters.s3-assets}}/models"  /work/assets/models
        aws s3 sync "{{workflow.parameters.s3-assets}}/derived" /work/assets/derived
      volumeMounts:
      - {mountPath: /work, name: work}
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: 'true'
    # UNVERIFIED: how this cluster expresses "give me a GPU node". The nvidia.com/gpu resource
    # above is the standard request and is usually enough with a device plugin installed; the
    # toleration below is the common NVIDIA taint. If the cluster labels GPU nodes instead, add
    # a nodeSelector here. Confirm before the first submit -- see the header.
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    outputs:
      artifacts:
      - name: run-evidence
        optional: true
        path: /work/out
    retryStrategy: {limit: 2, retryPolicy: OnError}
    volumes:
    - {name: git-data, emptyDir: {}}
    - {name: work, emptyDir: {}}
    # Node-local disk for the staged cube. 18 tiles x ~392 MB at 27 years is ~7 GB; the limit
    # is set well above that so a larger chunk does not evict the pod.
    - name: scratch
      emptyDir:
        sizeLimit: 64Gi
    - name: db-config
      secret:
        secretName: '{{workflow.parameters.db-config-secret}}'
        items:
        - {key: .datacube.conf, path: .datacube.conf}
    archiveLocation:
      archiveLogs: true
      s3:
        bucket: easido-prod-dc-data-projects
        endpoint: s3.amazonaws.com
        key: easi-workflows-team/biodiv/argo-artifacts/{{workflow.name}}/{{pod.name}}
  # artifactGC is OnWorkflowDeletion, so this is also the window in which
  # `argo cp ... --artifact-name run-evidence` still works. The S3 copies under _runs/ survive
  # either way; this only governs the Argo-side copy.
  ttlStrategy:
    secondsAfterSuccess: 86400
